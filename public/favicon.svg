  <path d="M42 22 C42 14, 58 14, 58 22 Z" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>
  <rect x="36" y="30" width="28" height="6" rx="2" fill="#FF758F"/>
  <!-- Goat head -->
  <ellipse cx="50" cy="56" rx="22" ry="20" fill="#FFFFFF" stroke="#333" stroke-width="2.5"/>
  <!-- Goat ears -->
  <path d="M28 48 C16 45, 14 60, 28 54 Z" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <path d="M72 48 C84 45, 86 60, 72 54 Z" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
