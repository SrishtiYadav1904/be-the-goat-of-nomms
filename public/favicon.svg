  <path d="M36 40 C32 30, 26 32, 28 38" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 40 C68 30, 74 32, 72 38" fill="none" stroke="#FFB703" stroke-width="3" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="43" cy="54" r="3" fill="#222"/>
  <circle cx="57" cy="54" r="3" fill="#222"/>
  <circle cx="44" cy="53" r="1" fill="#fff"/>
  <circle cx="58" cy="53" r="1" fill="#fff"/>
  <!-- Cheeks -->
  <ellipse cx="38" cy="60" rx="3.5" ry="2" fill="#FFB3C6" opacity="0.8"/>
  <ellipse cx="62" cy="60" rx="3.5" ry="2" fill="#FFB3C6" opacity="0.8"/>
  <!-- Snout -->
  <ellipse cx="50" cy="64" rx="8" ry="6" fill="#FFF0F3" stroke="#333" stroke-width="1.5"/>
  <path d="M48 63 L50 65 L52 63" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M50 65 L50 67" stroke="#333" stroke-width="1.5"/>
  <!-- Goat goatee -->
  <path d="M47 70 C50 75, 50 75, 53 70 Z" fill="#FFF" stroke="#333" stroke-width="1.5"/>
